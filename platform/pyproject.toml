[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "orchestra"
version = "0.1.0"
description = "Plateforme Orchestra : hiérarchie d'agents IA locale, observable et sécurisée"
requires-python = ">=3.11"
dependencies = [
  "fastapi>=0.110",
  "uvicorn[standard]>=0.29",
  "pydantic>=2.6",
  "pyyaml>=6",
  "httpx>=0.27",
  "watchdog>=4",
]

[project.optional-dependencies]
dev = ["pytest>=8"]
windows = ["win11toast>=0.35"]

[tool.setuptools.packages.find]
include = ["orchestra*"]

[tool.setuptools.package-data]
orchestra = ["vault_template/**/*", "vault_template/**/.*", "vault_template/.obsidian/*"]
